<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>খামার হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6f0;--card:#fff;--ink:#16261d;--mut:#5d6f64;--g:#1f5c3f;--r:#b23b2a;--line:#d3ded4;--hb:#1f5c3f;--hn:#9e3426;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#18261d;--ink:#e6efe8;--mut:#9bb0a2;--g:#6cc08f;--r:#ec8b7b;--line:#2b3f32;--hb:#245f42;--hn:#8c3a2c}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#18261d;--ink:#e6efe8;--mut:#9bb0a2;--g:#6cc08f;--r:#ec8b7b;--line:#2b3f32;--hb:#245f42;--hn:#8c3a2c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0 auto;max-width:560px;padding:14px 14px 92px;background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;line-height:1.6;font-size:16px}
body,.card{background-color:var(--bg)}
header h1{margin:0;font-size:1.3rem;font-weight:800;color:var(--g)}
header p{margin:0 0 10px;color:var(--mut);font-size:.82rem}
h2{font-size:1.05rem;margin:18px 0 8px}
.hero{background:var(--hb);color:#fff;border-radius:14px;padding:18px}
.hero.neg{background:var(--hn)}
.hero p{margin:0;opacity:.9}.hero h1{margin:2px 0;font-size:2.4rem;font-weight:800;line-height:1.2}.hero small{opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.farm{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.farm span{display:block;color:var(--mut);font-size:.82rem}
.p{color:var(--g)}.l{color:var(--r)}
label{display:block;font-size:.85rem;color:var(--mut);margin:8px 0}
input,select{display:block;width:100%;margin-top:3px;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px}
.btn{width:100%;margin-top:10px;padding:12px;font:inherit;font-weight:600;color:#fff;background:var(--hb);border:0;border-radius:10px;cursor:pointer}
.lnk{background:none;border:0;color:var(--mut);font:inherit;font-size:.82rem;text-decoration:underline;margin-top:8px;cursor:pointer}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.seg button.on{background:var(--hb);color:#fff;border-color:var(--hb)}
.row{display:flex;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.78rem;color:var(--mut)}
.stats b{display:block;font-size:.98rem;color:var(--ink)}
.bar{display:flex;align-items:center;gap:8px;font-size:.88rem;margin:6px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--r);min-width:2px}.bar i.g{background:var(--g)}
.bar em{font-style:normal;min-width:84px}.bar u{text-decoration:none;margin-left:auto;white-space:nowrap}
.tx{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.tx small{display:block;color:var(--mut)}.tx button{background:none;border:0;color:var(--mut);font-size:1rem;cursor:pointer}.tx .pay{padding:3px 10px;border:1px solid var(--r);border-radius:14px;color:var(--r);font-size:.85rem}.tx .pay.on{background:var(--hb);color:#fff;border-color:var(--hb)}
.empty{color:var(--mut);text-align:center;padding:16px}
summary{cursor:pointer;font-weight:600;color:var(--g)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;max-width:560px;margin:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:10px 2px;font:inherit;font-size:.8rem;color:var(--mut);background:none;border:0;border-radius:10px;cursor:pointer}
nav button.on{background:var(--hb);color:#fff;font-weight:600}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--hb);color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.hd{display:flex;justify-content:space-between;align-items:center}
#login{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:var(--bg);color:var(--ink)}
#login h1{margin:0;font-size:1.8rem;color:var(--g)}#login p{margin:0;color:var(--mut);max-width:320px}#login .btn{max-width:320px}
</style></head><body>
<header><div class="hd"><h1>খামার হিসাব</h1><button class="lnk" onclick="cloudLogout()">লগআউট</button></div><p id="who"></p></header>
<main id="app"></main>
<nav>
<button data-t="h" onclick="go('h')">আমার খামার</button>
<button data-t="a" onclick="go('a')">হিসাব লিখুন</button>
<button data-t="r" onclick="go('r')">রিপোর্ট</button>
<button data-t="m" onclick="go('m')">সংগঠন</button>
</nav>
<div id="toast"></div>
<script>
const T=['ব্রয়লার মুরগি','দেশি মুরগি','কোয়েল পাখি','ছাগল','গরু','হাঁস','মাছ চাষ','কবুতর','কৃষি পণ্য'];
const OUT=['বাচ্চা/বাছুর/চারা ক্রয়','খাবার','ওষুধ ও টিকা','শ্রমিক','বিদ্যুৎ ও পানি','অন্যান্য খরচ'];
const IN=['বিক্রি','সার/গোবর বিক্রি','অন্যান্য আয়'];
const MON=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const $=s=>document.querySelector(s);
const money=x=>'৳ '+Math.abs(x).toLocaleString('bn-BD');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const now=new Date();
let tab='h',R={farm:0,p:'m',m:now.getMonth(),y:now.getFullYear()},F={farm:1,kind:'out',cat:'',amt:'',date:iso(now),note:''};
function seed(){const y=now.getFullYear(),m=now.getMonth(),p=(mm,dd)=>iso(new Date(y,mm,dd));
return{farms:[{id:1,type:0,name:'ব্যাচ-১ (নমুনা)'},{id:2,type:3,name:'ছাগলের খামার (নমুনা)'}],txns:[
{id:1,farm:1,date:p(m,2),kind:'out',cat:OUT[0],amt:25000,note:'৫০০ বাচ্চা'},
{id:2,farm:1,date:p(m,9),kind:'out',cat:OUT[1],amt:42000,note:''},
{id:3,farm:1,date:p(m,15),kind:'out',cat:OUT[2],amt:6000,note:'টিকা'},
{id:4,farm:1,date:p(m,20),kind:'out',cat:OUT[3],amt:8000,note:''},
{id:5,farm:1,date:p(m,25),kind:'in',cat:IN[0],amt:98000,note:'মুরগি বিক্রি'},
{id:6,farm:2,date:p(m,4),kind:'out',cat:OUT[0],amt:30000,note:'৩টি ছাগল'},
{id:7,farm:2,date:p(m,12),kind:'out',cat:OUT[1],amt:7000,note:''},
{id:8,farm:2,date:p(m,22),kind:'in',cat:IN[1],amt:1500,note:'গোবর'}]}}
let S={farms:[],txns:[],mem:[],recs:[]};
function save(){window.cloudSave&&window.cloudSave()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function sum(a){let i=0,o=0;a.forEach(t=>t.kind==='in'?i+=t.amt:o+=t.amt);return{i,o,n:i-o}}
function go(t){if(tab==='a')readF();tab=t;render();scrollTo(0,0)}
function render(){$('#app').innerHTML=tab==='h'?home():tab==='a'?add():tab==='m'?mem():rep();
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab))}
function home(){const s=sum(S.txns);
return `<section class="hero ${s.n<0?'neg':''}"><p>সব খামার মিলিয়ে মোট ${s.n<0?'ক্ষতি':'লাভ'}</p><h1>${money(s.n)}</h1><small>আয় ${money(s.i)} − খরচ ${money(s.o)}</small></section><h2>আমার খামার</h2>`
+(S.farms.length?S.farms.map(f=>{const r=sum(S.txns.filter(t=>t.farm===f.id));
return `<button class="card farm" onclick="openR(${f.id})"><div><b>${esc(f.name)}</b><span>${T[f.type]}${f.count?' · জীবিত '+(f.count-dead(f.id)).toLocaleString('bn-BD')+'টি':''}</span></div><strong class="${r.n<0?'l':'p'}">${r.n<0?'ক্ষতি':'লাভ'} ${money(r.n)}</strong></button>`}).join(''):'<p class="empty">এখনো কোনো খামার নেই। নিচে যোগ করুন।</p>')
+`<details class="card"><summary>নতুন খামার যোগ করুন</summary><label>খামারের ধরন<select id="nt">${T.map((x,i)=>`<option value="${i}">${x}</option>`).join('')}</select></label><label>খামারের নাম<input id="nn" placeholder="যেমন: ব্যাচ-২"></label><label>শুরুর সংখ্যা (বাচ্চা বা পশু, ঐচ্ছিক)<input id="nc" type="number" inputmode="numeric"></label><button class="btn" onclick="addFarm()">খামার যোগ করুন</button></details><button class="lnk" onclick="reset()">সব তথ্য মুছে নতুন করে শুরু করুন</button>`}
function addFarm(){const n=$('#nn').value.trim();if(!n)return toast('খামারের নাম লিখুন');S.farms.push({id:Date.now(),type:+$('#nt').value,name:n,count:+$('#nc').value||0});save();render();toast('খামার যোগ হয়েছে')}
function reset(){if(confirm('সব খামার ও হিসাব মুছে যাবে। নিশ্চিত?')){S={farms:[],txns:[],mem:[],recs:[]};save();render()}}
function openR(id){R.farm=id;tab='r';render();scrollTo(0,0)}
function readF(){const g=i=>document.getElementById(i);if(!g('ff'))return;F.farm=+g('ff').value;F.cat=g('fc').value;F.amt=g('fa').value;F.date=g('fd').value;F.note=g('fn').value}
function kind(k){readF();F.kind=k;render()}
function add(){if(!S.farms.length)return '<p class="empty">আগে "আমার খামার" থেকে একটি খামার যোগ করুন।</p>';
if(!S.farms.find(f=>f.id===F.farm))F.farm=S.farms[0].id;
const L=F.kind==='out'?OUT:F.kind==='in'?IN:REC;if(!L.includes(F.cat))F.cat=L[0];
return `<h2>নতুন লেনদেন লিখুন</h2><div class="card"><div class="seg"><button class="${F.kind==='out'?'on':''}" onclick="kind('out')">খরচ</button><button class="${F.kind==='in'?'on':''}" onclick="kind('in')">আয়</button><button class="${F.kind==='rec'?'on':''}" onclick="kind('rec')">মৃত্যু/ডিম/দুধ</button></div>
<label>খামার<select id="ff">${S.farms.map(f=>`<option value="${f.id}" ${f.id===F.farm?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
<label>খাত<select id="fc">${L.map(c=>`<option ${c===F.cat?'selected':''}>${c}</option>`).join('')}</select></label>
<label>${F.kind==='rec'?'পরিমাণ':'টাকার পরিমাণ'}<input id="fa" type="number" inputmode="numeric" min="0" value="${esc(F.amt)}" placeholder="0"></label>
<label>তারিখ<input id="fd" type="date" value="${F.date}"></label>
<label>নোট (ঐচ্ছিক)<input id="fn" value="${esc(F.note)}"></label>
<button class="btn" onclick="saveT()">সংরক্ষণ করুন</button></div>`}
function saveT(){readF();const a=+F.amt;if(!(a>0))return toast('টাকার পরিমাণ লিখুন');
if(F.kind==='rec')S.recs.push({id:Date.now(),farm:F.farm,date:F.date,type:F.cat,qty:a});else S.txns.push({id:Date.now(),farm:F.farm,date:F.date,kind:F.kind,cat:F.cat,amt:a,note:F.note});F.amt='';F.note='';save();render();toast('সংরক্ষিত হয়েছে')}
function delT(id){S.txns=S.txns.filter(t=>t.id!==id);save();render()}
function rep(){const ym=R.y+'-'+String(R.m+1).padStart(2,'0');
const base=S.txns.filter(t=>!R.farm||t.farm===R.farm);
const tx=base.filter(t=>R.p==='y'?t.date.slice(0,4)==R.y:t.date.slice(0,7)===ym);
const s=sum(tx);
const ctl=`<h2>রিপোর্ট</h2><div class="card"><label>খামার<select onchange="R.farm=+this.value;render()"><option value="0">সব খামার</option>${S.farms.map(f=>`<option value="${f.id}" ${f.id===R.farm?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label>
<div class="seg"><button class="${R.p==='m'?'on':''}" onclick="R.p='m';render()">মাসিক</button><button class="${R.p==='y'?'on':''}" onclick="R.p='y';render()">বার্ষিক</button></div>
<div class="row">${R.p==='m'?`<select onchange="R.m=+this.value;render()">${MON.map((m,i)=>`<option value="${i}" ${i===R.m?'selected':''}>${m}</option>`).join('')}</select>`:''}<select onchange="R.y=+this.value;render()">${[0,1,2].map(k=>{const y=now.getFullYear()-k;return `<option value="${y}" ${y===R.y?'selected':''}>${y.toLocaleString('bn-BD',{useGrouping:false})}</option>`}).join('')}</select></div></div>`;
const st=`<div class="stats"><div>আয়<b class="p">${money(s.i)}</b></div><div>খরচ<b class="l">${money(s.o)}</b></div><div>${s.n<0?'ক্ষতি':'লাভ'}<b class="${s.n<0?'l':'p'}">${money(s.n)}</b></div></div>`;
let body='';
if(R.p==='y'){const rows=MON.map((m,i)=>({m,n:sum(base.filter(t=>t.date.slice(0,7)===R.y+'-'+String(i+1).padStart(2,'0'))).n}));
const mx=Math.max(1,...rows.map(r=>Math.abs(r.n)));
body='<h2>মাস অনুযায়ী লাভ-ক্ষতি</h2><div class="card">'+rows.map(r=>`<div class="bar"><em>${r.m}</em><i class="${r.n>=0?'g':''}" style="width:${Math.abs(r.n)/mx*45}%"></i><u class="${r.n<0?'l':'p'}">${r.n?money(r.n):'-'}</u></div>`).join('')+'</div>'}
else{const c={};tx.filter(t=>t.kind==='out').forEach(t=>c[t.cat]=(c[t.cat]||0)+t.amt);
const mx=Math.max(1,...Object.values(c));
body='<h2>খাত অনুযায়ী খরচ</h2><div class="card">'+(Object.keys(c).length?Object.entries(c).map(([k,v])=>`<div class="bar"><em>${k}</em><i style="width:${v/mx*40}%"></i><u>${money(v)}</u></div>`).join(''):'<p class="empty">এই মাসে কোনো খরচ নেই</p>')+'</div><h2>লেনদেনের তালিকা</h2><div class="card">'
+(tx.length?tx.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="tx"><div>${t.cat}<small>${t.date}${t.note?' · '+esc(t.note):''}</small></div><div><b class="${t.kind==='in'?'p':'l'}">${t.kind==='in'?'+':'−'}${money(t.amt)}</b> <button onclick="delT(${t.id})" aria-label="মুছুন">✕</button></div></div>`).join(''):'<p class="empty">কোনো লেনদেন নেই</p>')+'</div>'}
return ctl+st+recs()+body}
const REC=['মৃত্যু (সংখ্যা)','ডিম (সংখ্যা)','দুধ (লিটার)'];
let M={m:now.getMonth(),y:now.getFullYear()};
function dead(id){return S.recs.filter(r=>r.farm===id&&r.type===REC[0]).reduce((a,r)=>a+r.qty,0)}
function recs(){const ym=R.y+'-'+String(R.m+1).padStart(2,'0'),c={};
S.recs.filter(t=>(!R.farm||t.farm===R.farm)&&(R.p==='y'?t.date.slice(0,4)==R.y:t.date.slice(0,7)===ym)).forEach(t=>c[t.type]=(c[t.type]||0)+t.qty);
const k=Object.keys(c);return k.length?'<div class="card">'+k.map(x=>`<div class="bar"><em>${x}</em><u>${c[x].toLocaleString('bn-BD')}</u></div>`).join('')+'</div>':''}
function yrs(v,f){return [0,1,2].map(j=>{const y=now.getFullYear()-j;return `<option value="${y}" ${y===v?'selected':''}>${y.toLocaleString('bn-BD',{useGrouping:false})}</option>`}).join('')}
function mem(){const k=M.y+'-'+String(M.m+1).padStart(2,'0');let got=0,due=0;
S.mem.forEach(x=>x.paid&&x.paid[k]?got+=x.fee:due+=x.fee);
return `<h2>সংগঠনের সদস্য ও ফি</h2><div class="card"><div class="row"><select onchange="M.m=+this.value;render()">${MON.map((m,i)=>`<option value="${i}" ${i===M.m?'selected':''}>${m}</option>`).join('')}</select><select onchange="M.y=+this.value;render()">${yrs(M.y)}</select></div></div>
<div class="stats"><div>আদায়<b class="p">${money(got)}</b></div><div>বাকি<b class="l">${money(due)}</b></div><div>সদস্য<b>${S.mem.length.toLocaleString('bn-BD')} জন</b></div></div><div class="card">`
+(S.mem.length?S.mem.map(x=>{const p=x.paid&&x.paid[k];return `<div class="tx"><div>${esc(x.name)}<small>মাসিক ফি ${money(x.fee)}</small></div><div><button class="pay ${p?'on':''}" onclick="pay(${x.id},'${k}')">${p?'দিয়েছেন':'বাকি'}</button> <button onclick="delM(${x.id})" aria-label="মুছুন">✕</button></div></div>`}).join(''):'<p class="empty">এখনো কোনো সদস্য নেই। নিচে যোগ করুন।</p>')
+`</div><details class="card"><summary>নতুন সদস্য যোগ করুন</summary><label>নাম<input id="mn"></label><label>মাসিক ফি (টাকা)<input id="mf" type="number" inputmode="numeric"></label><button class="btn" onclick="addM()">সদস্য যোগ করুন</button></details>`}
function addM(){const n=$('#mn').value.trim(),f=+$('#mf').value;if(!n||!(f>0))return toast('নাম ও ফি লিখুন');S.mem.push({id:Date.now(),name:n,fee:f,paid:{}});save();render()}
function pay(id,k){const x=S.mem.find(a=>a.id===id);x.paid=x.paid||{};x.paid[k]=!x.paid[k];save();render()}
function delM(id){S.mem=S.mem.filter(a=>a.id!==id);save();render()}
function setData(d){S=Object.assign({farms:[],txns:[],mem:[],recs:[]},d||{});render()}
function getData(){return S}
render();
